name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint the action and the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflows, with shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.33.0 pyyaml==6.0.2
      - name: action.yml against the schema of action metadata
        run: check-jsonschema --builtin-schema vendor.github-actions action.yml
      - name: the action's scripts with shellcheck
        run: |
          python3 - <<'EOF'
          import yaml, subprocess, tempfile, os
          steps = yaml.safe_load(open("action.yml"))["runs"]["steps"]
          bad = 0
          for i, s in enumerate(steps):
              if "run" not in s:
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as f:
                  # the runner fills the action's expressions; shellcheck sees a placeholder (the opening
                  # is built from parts: written whole here, the workflow would take it as its own)
                  f.write("#!/usr/bin/env bash\n" + s["run"].replace("$" + "{{", "\"$" + "{X").replace("}}", "}\""))
              r = subprocess.run(["shellcheck", "-S", "warning", f.name])
              bad |= r.returncode
              os.unlink(f.name)
          raise SystemExit(bad)
          EOF

  samples:
    name: the samples against the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.33.0
      - name: the schema is a valid JSON Schema
        run: check-jsonschema --check-metaschema schema/report-v1.schema.json
      - name: every sample report validates
        run: check-jsonschema --schemafile schema/report-v1.schema.json samples/*.json
      - name: every code of a sample is in the list of codes
        run: |
          python3 - <<'EOF'
          import json, glob
          codes = set(open("schema/codes.txt").read().split())
          bad = []
          for f in glob.glob("samples/*.json"):
              for x in json.load(open(f)).get("findings", []):
                  if x["code"] not in codes:
                      bad.append(f"{f}: {x['code']}")
          print("\n".join(bad) or "every code is listed")
          raise SystemExit(1 if bad else 0)
          EOF
